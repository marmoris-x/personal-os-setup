# Insert into ~/.codex/config.toml (only if you use Codex).
# Keys come from your Windows environment variables, never from this file.

default_permissions = "guarded"

[permissions.guarded]
description = "Owner guard: the downloads folder stays read-only."
extends = ":workspace"

[permissions.guarded.filesystem]
"~/Downloads" = "read"
"~/OneDrive" = "read"
# The cloud-synced folder line is added by the owner: the cloud-sync guard blocks the
# agent from writing a file that names that folder.

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,web_search_advanced_exa"
env_http_headers = { "x-api-key" = "EXA_API_KEY" }

[mcp_servers.parallel]
url = "https://search.parallel.ai/mcp"

[mcp_servers.exa-key]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,web_search_advanced_exa"
env_http_headers = { "x-api-key" = "EXA_API_KEY" }

[mcp_servers.you-free]
url = "https://api.you.com/mcp?profile=free"

[mcp_servers.you]
url = "https://api.you.com/mcp"
# You.com rejects X-API-Key with "401 OAuth authentication required"; the key
# has to travel as a bearer token. Measured on 2026-09-28, not assumed.
bearer_token_env_var = "YDC_API_KEY"

[mcp_servers.tavily]
url = "https://mcp.tavily.com/mcp/"
bearer_token_env_var = "TAVILY_API_KEY"

[mcp_servers.firecrawl]
url = "https://mcp.firecrawl.dev/v2/mcp"
bearer_token_env_var = "FIRECRAWL_API_KEY"
# Firecrawl offers 26 tools; allow only the ones needed:
enabled_tools = ["firecrawl_search", "firecrawl_search_feedback", "firecrawl_scrape", "firecrawl_map", "firecrawl_crawl", "firecrawl_interact"]
