# gitleaks extra rules (default rules stay active). Tested 2026-09-23 with gitleaks 8.30.1.
# Repo-authored (type: doc-only in setup/manifest.yaml) - see the comment there for why this
# file is not mirrored from a live copy.
[extend]
useDefault = true

# Imported public documentation contains sample keys and tokens on purpose. It is third-party
# text, stored in exactly two places (see the docs rule in CLAUDE.md), and only those two
# paths are exempt. A real key anywhere else is still caught.
[[allowlists]]
description = "imported public documentation: docs/vendor/ in a project, 500-sources/docs/ in the vault"
paths = [
  '''(^|[\\/])docs[\\/]vendor[\\/]''',
  '''(^|[\\/])500-sources[\\/]docs[\\/]''',
]

# A live copy may carry one more allowlist here: three former vault imports, exempted by exact
# path (user decision 2026-10-08). Their paths name personal projects, so they stay out of this
# repository. A config is installed once and never overwritten, so a person who needs those
# exemptions adds them to their own file and keeps them.

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek API key"
regex = '''\bsk-[a-f0-9]{32}\b'''
keywords = ["sk-"]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\bsk-or-v1-[a-f0-9]{64}\b'''
keywords = ["sk-or-v1-"]
