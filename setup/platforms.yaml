# personal-os-setup - the platform map (decision D3 of the cross-platform task).
#
# One entry per manifest component and one section per operating system. The engine reads
# this file; it never guesses. `setup/tools/verify-all.ps1` check H fails when a manifest
# component has no entry for windows, macos or linux, and check L fails when
# docs/platforms.md and this file disagree.
#
# Value vocabulary (one value per component and OS):
#   files                     the component installs files (copy, template, doc-only, dir)
#   dirs                      the component only creates folders
#   packages:<path>           installed through the OS package file at <path>
#   scheduler:<kind>          registered with that OS scheduler
#                             (task-scheduler | launchd | systemd-user)
#   mcp | plugin | generated  as today, identical on every OS
#   reboot-proof:<what>       the OS does the job itself and install.ps1 only reports it
#   homebrew-service:<name>   enabled with `brew services start <name>`
#   systemd-user:<unit>       enabled with `systemctl --user enable --now <unit>`
#   manual:<what>             the person does it once; install.ps1 only prints it
#   unsupported: <reason>     not available here. A reason is mandatory - red line 5 of
#                             the task: a component that cannot work is reported, never
#                             silently disabled.

version: 1

platforms:
  windows:
    id: windows
    os_name: Windows
    state_dir: "{LOCALAPPDATA}/personal-os-setup"
    package_tool: winget-configure
    package_file: windows/configuration.winget
    scheduler: task-scheduler
    documents: known-folder
    default_vault: "{HOME}/PersonalOS"
    default_dev: "C:/Dev"
  macos:
    id: macos
    os_name: macOS
    state_dir: "{HOME}/.local/state/personal-os-setup"
    package_tool: brew-bundle
    package_file: macos/Brewfile
    scheduler: launchd
    documents: "{HOME}/Documents"
    default_vault: "{HOME}/PersonalOS"
    default_dev: "{HOME}/Dev"
  linux:
    id: linux
    os_name: Linux
    state_dir: "{HOME}/.local/state/personal-os-setup"
    package_tool: distro-packages
    package_file: linux/packages.yaml
    scheduler: systemd-user
    documents: "{HOME}/Documents"
    default_vault: "{HOME}/PersonalOS"
    default_dev: "{HOME}/Dev"

